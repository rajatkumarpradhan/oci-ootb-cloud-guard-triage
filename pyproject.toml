[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-ootb-cloud-guard-triage"
version = "0.1.0"
description = "Cloud Guard enablement template plus an offline triage reporter for problem exports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
oci-ootb-cloud-guard-triage = "oci_ootb_cloud_guard_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
